<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Acres Night Cabs — Neon Traffic Puzzle</title>
<meta name="description" content="Acres Night Cabs: a neon night-drive spin on the tap-to-clear traffic puzzle. Send the cabs home to Acres Homes.">
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<style>
  :root{
    --bg-0:#070b18;
    --bg-1:#0d1430;
    --grid:#1b2450;
    --glass:rgba(255,255,255,.06);
    --glass-line:rgba(140,170,255,.22);
    --ink:#eaf0ff;
    --muted:#8ea0d8;
    --gold:#ffcf5c;
    --hot:#ff5d8f;
    --cyan:#37e6ff;
    --lime:#8dff7a;
    --violet:#b98bff;
    --tangerine:#ff9d43;
    --red:#ff5252;
    --azure:#4d8bff;
    --slot:#0a1130;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #16204d 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #2a0f3a 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0));
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; overflow-x:hidden;
    user-select:none;
  }
  /* moving scanline / road glow ambience */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(0deg, rgba(120,150,255,.035) 0 2px, transparent 2px 5px);
    mix-blend-mode:screen; opacity:.5;
  }

  .wrap{position:relative; z-index:1; width:100%; max-width:560px; padding:14px 14px 28px; display:flex; flex-direction:column; gap:12px;}

  header.hud{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .title{display:flex; flex-direction:column; line-height:1;}
  .title .k{font-size:.62rem; letter-spacing:.32em; text-transform:uppercase; color:var(--cyan); font-weight:800;}
  .title .n{font-size:1.28rem; font-weight:900; letter-spacing:.5px;
    background:linear-gradient(90deg,#fff,var(--cyan) 40%,var(--hot));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px rgba(55,230,255,.25));}
  .stats{display:flex; gap:8px;}
  .chip{
    background:var(--glass); border:1px solid var(--glass-line); border-radius:12px;
    padding:6px 10px; min-width:58px; text-align:center; backdrop-filter:blur(6px);
  }
  .chip .lbl{font-size:.54rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .chip .val{font-size:1.05rem; font-weight:900; color:#fff; margin-top:1px;}
  .chip.level .val{color:var(--gold);}
  .chip.score .val{color:var(--lime);}

  /* Staging lane */
  .lane-wrap{
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--glass-line); border-radius:16px; padding:10px;
    box-shadow:inset 0 0 30px rgba(80,110,255,.08);
  }
  .lane-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .lane-top .cap{font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:800;}
  .lane{
    display:grid; grid-template-columns:repeat(7,1fr); gap:7px;
  }
  .slot{
    aspect-ratio:1/1.15; border-radius:12px; background:var(--slot);
    border:1px dashed rgba(140,170,255,.25);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    transition:transform .15s ease;
  }
  .slot .cab{position:absolute; inset:10%;}
  .slot.pop{animation:pop .4s ease both;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(0)}}
  .slot.arrive .cab{animation:drop .28s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes drop{0%{transform:translateY(-70%) scale(.6); opacity:0}100%{transform:translateY(0) scale(1); opacity:1}}

  /* Board */
  .board-frame{
    position:relative; border-radius:20px; padding:12px;
    background:
      radial-gradient(120% 120% at 50% 0%, rgba(70,100,220,.15), transparent 60%),
      linear-gradient(180deg,#0b1235,#080d24);
    border:1px solid var(--glass-line);
    box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(60,90,200,.10);
  }
  .board{
    position:relative; width:100%;
    background-image:
      linear-gradient(rgba(120,150,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,255,.10) 1px, transparent 1px);
    border-radius:12px;
  }
  .cab{
    position:absolute; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:left .34s cubic-bezier(.4,0,.2,1), top .34s cubic-bezier(.4,0,.2,1),
               transform .18s ease, opacity .3s ease;
    will-change:left,top,transform;
    box-shadow:0 6px 14px rgba(0,0,0,.45);
    color:#0a1024;
  }
  .cab::before{ /* glossy top */
    content:""; position:absolute; inset:0; border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 42%);
    opacity:.8; pointer-events:none;
  }
  .cab .arrow{position:relative; z-index:2; width:52%; height:52%;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}
  .cab.hint{animation:hint 1s ease-in-out infinite;}
  @keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .cab.press{transform:scale(.9);}
  .cab.blocked{animation:shake .32s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .cab.dim{filter:saturate(.5) brightness(.75);}
  .cab.picked{outline:3px solid #fff; outline-offset:-3px; box-shadow:0 0 22px rgba(255,255,255,.6);}

  /* controls */
  .controls{display:flex; gap:10px;}
  .btn{
    flex:1; border:1px solid var(--glass-line); background:var(--glass);
    color:var(--ink); border-radius:14px; padding:12px 8px; font-weight:800;
    font-size:.82rem; letter-spacing:.02em; cursor:pointer; backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; gap:3px; transition:transform .1s, border-color .2s, background .2s;
  }
  .btn:active{transform:translateY(2px) scale(.98);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn .ico{font-size:1.15rem;}
  .btn .ct{font-size:.6rem; color:var(--muted); font-weight:700;}
  .btn.tow.armed{border-color:var(--gold); background:rgba(255,207,92,.15); box-shadow:0 0 18px rgba(255,207,92,.35);}

  .hintbar{font-size:.72rem; color:var(--muted); text-align:center; min-height:1em;}
  .hintbar b{color:var(--cyan);}

  footer.tag{font-size:.62rem; color:#5c6aa0; text-align:center; margin-top:2px;}
  footer.tag a{color:#7f8fd0;}

  /* overlay */
  .overlay{
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(4,7,18,.82); backdrop-filter:blur(8px); padding:24px;
  }
  .overlay.show{display:flex; animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{
    width:100%; max-width:360px; text-align:center;
    background:linear-gradient(180deg,#101a44,#0a1130);
    border:1px solid var(--glass-line); border-radius:22px; padding:26px 22px;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
  }
  .panel h2{margin:0 0 6px; font-size:1.7rem; font-weight:900;
    background:linear-gradient(90deg,var(--gold),var(--hot));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .panel p{margin:0 0 16px; color:var(--muted); font-size:.9rem; line-height:1.5;}
  .panel .big{font-size:2.4rem; font-weight:900; color:#fff; margin:6px 0 2px;}
  .panel .big small{font-size:.8rem; color:var(--muted); font-weight:700; letter-spacing:.15em; display:block;}
  .play{
    margin-top:6px; width:100%; border:none; cursor:pointer;
    background:linear-gradient(90deg,var(--cyan),var(--azure)); color:#04122e;
    font-weight:900; font-size:1.05rem; padding:14px; border-radius:14px;
    box-shadow:0 10px 30px rgba(55,230,255,.35); transition:transform .1s;
  }
  .play:active{transform:translateY(2px);}
  .rules{text-align:left; font-size:.8rem; color:#b9c6f2; line-height:1.55; margin:0 0 6px; padding-left:1.1em;}
  .rules li{margin-bottom:5px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="title">
      <span class="k">Acres Homes</span>
      <span class="n">Night Cabs</span>
    </div>
    <div class="stats">
      <div class="chip level"><div class="lbl">Level</div><div class="val" id="lvl">1</div></div>
      <div class="chip"><div class="lbl">Cabs</div><div class="val" id="left">0</div></div>
      <div class="chip score"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
    </div>
  </header>

  <div class="lane-wrap">
    <div class="lane-top">
      <span class="cap">Staging Lane · match 3 to send home</span>
      <span class="cap" id="lanecount">0/7</span>
    </div>
    <div class="lane" id="lane"></div>
  </div>

  <div class="board-frame">
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnShuffle"><span class="ico">🔀</span>Shuffle<span class="ct" id="ctShuffle">×3</span></button>
    <button class="btn tow" id="btnTow"><span class="ico">🪝</span>Tow Out<span class="ct" id="ctTow">×2</span></button>
    <button class="btn" id="btnHint"><span class="ico">💡</span>Hint<span class="ct">free</span></button>
    <button class="btn" id="btnRestart"><span class="ico">↺</span>Restart<span class="ct">level</span></button>
  </div>

  <div class="hintbar" id="hintbar">Tap a cab to drive it out along its arrow — the road ahead must be clear.</div>

  <footer class="tag">A neon spin on the classic traffic-jam puzzle · <a href="../index.html">City of Acres Homes</a></footer>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <span class="k" id="oKicker" style="color:var(--cyan);letter-spacing:.3em;font-weight:800;font-size:.6rem;text-transform:uppercase;">Acres Homes</span>
    <h2 id="oTitle">Night Cabs</h2>
    <div id="oBody"></div>
    <button class="play" id="oPlay">Start Driving</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- Vehicle palette ----------
  const COLORS = [
    {n:"gold",     c:"#ffcf5c", g:"#a8791f"},
    {n:"hot",      c:"#ff5d8f", g:"#a12651"},
    {n:"cyan",     c:"#37e6ff", g:"#1483a0"},
    {n:"lime",     c:"#8dff7a", g:"#3ba32e"},
    {n:"violet",   c:"#b98bff", g:"#6a3fb0"},
    {n:"tangerine",c:"#ff9d43", g:"#b35e12"},
    {n:"red",      c:"#ff5252", g:"#a32222"},
    {n:"azure",    c:"#4d8bff", g:"#1f4fb0"},
  ];
  const DIRS = {
    up:    {dr:-1, dc:0, rot:0},
    right: {dr:0,  dc:1, rot:90},
    down:  {dr:1,  dc:0, rot:180},
    left:  {dr:0,  dc:-1,rot:270},
  };
  const DIRKEYS = Object.keys(DIRS);
  const LANE_CAP = 7;
  const MATCH = 3;

  const ARROW_SVG = (rot) =>
    `<svg class="arrow" viewBox="0 0 24 24" style="transform:rotate(${rot}deg)">
       <path d="M12 3 L20 13 L14.5 13 L14.5 21 L9.5 21 L9.5 13 L4 13 Z"
             fill="currentColor" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
     </svg>`;

  // ---------- Level config ----------
  function levelConfig(lv){
    const cols = Math.min(4 + Math.floor((lv-1)/2), 7);   // 4 → 7
    const rows = Math.min(5 + Math.floor((lv-1)/2), 8);    // 5 → 8
    const colorCount = Math.min(3 + Math.floor((lv-1)/2), COLORS.length);
    // number of cab groups (each group = 3 cabs of a color)
    const cells = rows*cols;
    let groups = Math.round(cells * 0.55 / MATCH);
    groups = Math.max(colorCount, groups);
    return {rows, cols, colorCount, groups};
  }

  // ---------- State ----------
  let state = null;
  const $ = (id)=>document.getElementById(id);
  const board = $("board"), laneEl = $("lane");
  let towArmed = false, busy = false;

  function rint(n){ return Math.floor(Math.random()*n); }
  function shuffleArr(a){ for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }

  // ---------- Build level ----------
  function buildLevel(lv){
    const cfg = levelConfig(lv);
    const {rows, cols, colorCount, groups} = cfg;
    // choose colors
    const pal = shuffleArr(COLORS.slice()).slice(0, colorCount);
    // build a bag of cabs: `groups` groups, spread across colors, each group = 3 same color
    const bag = [];
    for(let g=0; g<groups; g++){
      const col = pal[g % colorCount];
      for(let k=0;k<MATCH;k++) bag.push(col);
    }
    // ensure fits
    const total = Math.min(bag.length, rows*cols);
    bag.length = total;
    // if trimming broke multiples of 3, top down to nearest complete set per color
    const byColor = {};
    bag.forEach(c=>byColor[c.n]=(byColor[c.n]||0)+1);
    // remove leftovers that aren't multiples of 3
    const finalBag = [];
    const counts = {};
    for(const c of bag){
      counts[c.n]=(counts[c.n]||0);
      finalBag.push(c); counts[c.n]++;
    }
    // trim per color to multiple of 3
    const keep = [];
    const per = {};
    for(const c of finalBag){ per[c.n]=(per[c.n]||0)+1; }
    for(const name in per){ per[name] = per[name] - (per[name]%MATCH); }
    const used = {};
    for(const c of finalBag){
      used[c.n]=used[c.n]||0;
      if(used[c.n] < per[c.n]){ keep.push(c); used[c.n]++; }
    }
    shuffleArr(keep);

    // place into grid cells
    const cellIdx = shuffleArr(Array.from({length:rows*cols},(_,i)=>i)).slice(0, keep.length);
    const grid = Array.from({length:rows},()=>Array(cols).fill(null));
    let idHint = 0;
    cellIdx.forEach((idx,i)=>{
      const r = Math.floor(idx/cols), c = idx%cols;
      grid[r][c] = { id:"v"+(idHint++), color:keep[i], dir:DIRKEYS[rint(4)] };
    });

    state = {
      lv, rows, cols, grid,
      remaining: keep.length,
      lane: [],                 // {color}
      score: state ? state.score : 0,
      shuffle: 3, tow: 2,
    };
    towArmed = false;
  }

  // ---------- Rendering ----------
  function sizing(){
    const gap = 6;
    const bw = board.clientWidth || 500;
    const cell = (bw - gap*(state.cols-1)) / state.cols;
    return {gap, cell};
  }

  function layoutBoard(){
    const {gap, cell} = sizing();
    board.style.height = (state.rows*cell + (state.rows-1)*gap) + "px";
    board.style.backgroundSize = `${cell+gap}px ${cell+gap}px`;
    board.querySelectorAll(".cab").forEach(el=>{
      const r = +el.dataset.r, c = +el.dataset.c;
      if(state.grid[r][c]){
        el.style.left = c*(cell+gap)+"px";
        el.style.top  = r*(cell+gap)+"px";
        el.style.width = cell+"px";
        el.style.height = cell+"px";
      }
    });
  }

  function renderBoard(){
    board.innerHTML = "";
    const {gap, cell} = sizing();
    board.style.height = (state.rows*cell + (state.rows-1)*gap) + "px";
    board.style.backgroundSize = `${cell+gap}px ${cell+gap}px`;
    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        const v = state.grid[r][c];
        if(!v) continue;
        board.appendChild(makeCab(v,r,c,cell,gap));
      }
    }
  }

  function makeCab(v,r,c,cell,gap){
    const el = document.createElement("div");
    el.className="cab"; el.dataset.r=r; el.dataset.c=c; el.dataset.id=v.id;
    el.style.left=c*(cell+gap)+"px"; el.style.top=r*(cell+gap)+"px";
    el.style.width=cell+"px"; el.style.height=cell+"px";
    el.style.background=`linear-gradient(160deg, ${v.color.c}, ${v.color.g})`;
    el.style.color = pickInk(v.color.c);
    el.innerHTML = ARROW_SVG(DIRS[v.dir].rot);
    el.addEventListener("click", ()=>onTap(r,c,el));
    return el;
  }
  function pickInk(hex){
    const n=parseInt(hex.slice(1),16), r=n>>16,g=(n>>8)&255,b=n&255;
    return (r*0.299+g*0.587+b*0.114) > 150 ? "rgba(10,16,36,.85)" : "rgba(255,255,255,.92)";
  }

  function renderLane(){
    laneEl.innerHTML="";
    for(let i=0;i<LANE_CAP;i++){
      const s=document.createElement("div"); s.className="slot";
      const item = state.lane[i];
      if(item){
        const cab=document.createElement("div"); cab.className="cab";
        cab.style.position="absolute"; cab.style.inset="12%";
        cab.style.background=`linear-gradient(160deg, ${item.color.c}, ${item.color.g})`;
        cab.style.borderRadius="10px";
        s.appendChild(cab);
        if(item.fresh){ s.classList.add("arrive"); item.fresh=false; }
      }
      laneEl.appendChild(s);
    }
    $("lanecount").textContent = state.lane.length+"/"+LANE_CAP;
  }

  function renderHUD(){
    $("lvl").textContent=state.lv;
    $("left").textContent=state.remaining;
    $("score").textContent=state.score;
    $("ctShuffle").textContent="×"+state.shuffle;
    $("ctTow").textContent="×"+state.tow;
    $("btnShuffle").disabled = state.shuffle<=0;
    $("btnTow").disabled = state.tow<=0;
  }

  // ---------- Rules ----------
  function pathClear(r,c){
    const v=state.grid[r][c]; const d=DIRS[v.dir];
    let nr=r+d.dr, nc=c+d.dc;
    while(nr>=0 && nr<state.rows && nc>=0 && nc<state.cols){
      if(state.grid[nr][nc]) return false;
      nr+=d.dr; nc+=d.dc;
    }
    return true;
  }

  function anyMove(){
    for(let r=0;r<state.rows;r++)
      for(let c=0;c<state.cols;c++)
        if(state.grid[r][c] && pathClear(r,c)) return {r,c};
    return null;
  }

  // ---------- Interaction ----------
  function onTap(r,c,el){
    if(busy) return;
    const v=state.grid[r][c];
    if(!v) return;

    if(towArmed){
      towArmed=false; $("btnTow").classList.remove("armed");
      state.tow--;
      driveOut(r,c,el,true);
      return;
    }

    if(!pathClear(r,c)){
      el.classList.add("blocked");
      setTimeout(()=>el.classList.remove("blocked"),320);
      flash("That road is blocked — clear a path first.");
      return;
    }
    driveOut(r,c,el,false);
  }

  function driveOut(r,c,el,towed){
    const v=state.grid[r][c];
    // check lane space first (would-be add)
    if(state.lane.length>=LANE_CAP){
      flash("Staging lane is full!");
      return;
    }
    busy=true;
    state.grid[r][c]=null;
    state.remaining--;
    el.classList.add("press");

    const {gap,cell}=sizing();
    const d=DIRS[v.dir];
    // distance to fly off board
    let far;
    if(towed){ far = {x:0,y: (state.rows+1)*(cell+gap)}; } // drop downward toward lane
    else{
      const cellsOut = 2 + (d.dr!==0 ? state.rows : state.cols);
      far = { x: d.dc*cellsOut*(cell+gap), y: d.dr*cellsOut*(cell+gap) };
    }
    requestAnimationFrame(()=>{
      el.style.transition="transform .38s cubic-bezier(.4,0,.6,1), opacity .38s ease";
      el.style.transform=`translate(${far.x}px,${far.y}px) scale(${towed?.4:.7})`;
      el.style.opacity="0";
    });

    setTimeout(()=>{
      el.remove();
      addToLane(v.color);
      busy=false;
    }, 300);
  }

  function addToLane(color){
    state.lane.push({color, fresh:true});
    // keep lane grouped by color for satisfying matching
    state.lane.sort((a,b)=> a.color.n.localeCompare(b.color.n));
    renderLane();
    state.score += 5;
    renderHUD();
    // resolve matches (may cascade)
    setTimeout(resolveMatches, 180);
  }

  function resolveMatches(){
    const counts={};
    state.lane.forEach(x=>counts[x.color.n]=(counts[x.color.n]||0)+1);
    let matchedColor=null;
    for(const name in counts){ if(counts[name]>=MATCH){ matchedColor=name; break; } }
    if(matchedColor){
      // pop the matched slots visually
      const slots=[...laneEl.children];
      let popped=0; const idxToRemove=[];
      state.lane.forEach((x,i)=>{
        if(x.color.n===matchedColor && popped<MATCH){ idxToRemove.push(i); popped++; }
      });
      idxToRemove.forEach(i=> slots[i] && slots[i].classList.add("pop"));
      state.score += 60;
      $("score").textContent=state.score;
      setTimeout(()=>{
        state.lane = state.lane.filter((x,i)=> !idxToRemove.includes(i));
        renderLane();
        renderHUD();
        setTimeout(resolveMatches, 120); // cascade
      }, 360);
      return;
    }
    // no match — check states
    checkEnd();
  }

  function checkEnd(){
    if(state.remaining<=0 && state.lane.length===0){
      winLevel(); return;
    }
    if(state.lane.length>=LANE_CAP){
      // lose if lane full and nothing on board can help? Actually lane full is immediate loss
      gameOver(); return;
    }
    if(state.remaining>0 && !anyMove()){
      // no cab can exit — offer shuffle or lose
      if(state.shuffle>0){
        flash("No open roads! Use 🔀 Shuffle to redirect the cabs.");
      } else {
        gameOver();
      }
    }
  }

  // ---------- Powerups ----------
  function doShuffle(){
    if(state.shuffle<=0 || busy) return;
    state.shuffle--;
    for(let r=0;r<state.rows;r++)
      for(let c=0;c<state.cols;c++)
        if(state.grid[r][c]) state.grid[r][c].dir=DIRKEYS[rint(4)];
    renderBoard();
    renderHUD();
    flash("Cabs redirected!");
  }
  function armTow(){
    if(state.tow<=0 || busy) return;
    towArmed=!towArmed;
    $("btnTow").classList.toggle("armed",towArmed);
    flash(towArmed ? "Tow armed — tap any cab to pull it straight out." : "Tow cancelled.");
  }
  function doHint(){
    const m=anyMove();
    board.querySelectorAll(".cab").forEach(e=>e.classList.remove("hint"));
    if(m){
      const el=board.querySelector(`.cab[data-r="${m.r}"][data-c="${m.c}"]`);
      if(el){ el.classList.add("hint"); setTimeout(()=>el.classList.remove("hint"),2500); }
      flash("Highlighted a cab with a clear road.");
    } else {
      flash(state.shuffle>0 ? "Nothing can move — try 🔀 Shuffle." : "Nothing can move and no shuffles left.");
    }
  }

  // ---------- Flow ----------
  function flash(msg){ $("hintbar").innerHTML = msg.replace(/(🔀|🪝|💡)/g,'<b>$1</b>'); }

  function startLevel(lv){
    buildLevel(lv);
    renderBoard(); renderLane(); renderHUD();
    flash("Tap a cab to drive it out along its arrow — the road ahead must be clear.");
  }

  function winLevel(){
    state.score += 200 + state.lv*25;
    showOverlay("Sent Home! 🏡",
      `Level ${state.lv} cleared`,
      `<div class="big">${state.score}<small>Total Score</small></div>
       <p>Every cab made it back to Acres Homes.</p>`,
      "Next Level", ()=>{ startLevel(state.lv+1); });
  }
  function gameOver(){
    showOverlay("Gridlocked 🚧",
      "The lane jammed up",
      `<div class="big">${state.score}<small>Final Score · Level ${state.lv}</small></div>
       <p>The staging lane clogged before the roads cleared. Try again?</p>`,
      "Retry Level", ()=>{ state.score = Math.max(0,state.score-0); startLevel(state.lv); });
    // reset score on retry? keep score but restart level fresh
    state.score = state.score; // keep
  }

  function showOverlay(title, kicker, bodyHTML, btn, cb){
    $("oTitle").textContent=title;
    $("oKicker").textContent=kicker;
    $("oBody").innerHTML=bodyHTML;
    const b=$("oPlay"); b.textContent=btn;
    const ov=$("overlay"); ov.classList.add("show");
    b.onclick=()=>{ ov.classList.remove("show"); cb(); };
  }

  function intro(){
    showOverlay("Night Cabs","Acres Homes",
      `<ul class="rules">
        <li><b>Tap a cab</b> and it drives out along its arrow — but only if the road ahead is clear to the edge.</li>
        <li>Cabs pull into the <b>staging lane</b>. Line up <b>3 of one color</b> and they head home together.</li>
        <li>Fill the lane with 7 stuck cabs and it's <b>gridlock</b>. Clear the whole board to win.</li>
        <li>Stuck? Use <b>🔀 Shuffle</b> to redirect, <b>🪝 Tow</b> to yank one out, or <b>💡 Hint</b>.</li>
       </ul>`,
      "Start Driving", ()=>{ state=null; startLevel(1); });
  }

  // ---------- Events ----------
  $("btnShuffle").onclick=doShuffle;
  $("btnTow").onclick=armTow;
  $("btnHint").onclick=doHint;
  $("btnRestart").onclick=()=>{ if(state) startLevel(state.lv); };
  window.addEventListener("resize", ()=>{ if(state) layoutBoard(); });

  intro();
})();
</script>
</body>
</html>
